<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Clip WaxVocoder</title>
    <link rel="stylesheet" href="./clip.css" />
  </head>
  <body>
    <!-- Clip « paroles » : chaque image est dessinée pour un instant donné par renderFrame(index),
         à partir des données (spectre, paroles, parties) passées par setClipData. Voir scripts/clip.ts. -->
    <canvas id="screen" width="1920" height="1080"></canvas>
    <div class="preload"><span class="michroma">Aa</span><span class="barlow">Aa</span><span class="barlow-bold">Aa</span></div>
    <script>
      const W = 1920
      const H = 1080
      const canvas = document.getElementById('screen')
      const g = canvas.getContext('2d')
      let data

      const MINT = [140, 245, 210]
      const AMBER = [255, 191, 107]
      const PALE = [205, 222, 216]
      const rgba = ([r, gr, b], a) => `rgba(${r}, ${gr}, ${b}, ${a})`
      const VOICES = {
        Tom: { color: MINT, label: 'Tom, l’IA', side: 'left' },
        Jessica: { color: AMBER, label: 'Jessica', side: 'right' },
        'Chœur': { color: [180, 255, 230], label: 'Le chœur des machines', side: 'center' },
        Robot: { color: PALE, label: 'La machine', side: 'center' },
      }
      const LANGUAGES = { fr: 'en français', en: 'in English', de: 'auf Deutsch' }
      const SECTION_NAMES = { intro: 'Ouverture', verse: 'Couplet', chorus: 'Refrain', bridge: 'Dialogue', final: 'Dernier refrain', outro: 'Extinction', coda: 'Veille', break: 'Pause' }

      // Pseudo-random numbers that do not change between frames.
      const clamp = (value) => Math.max(0, Math.min(1, value))
      const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }

      window.setClipData = (json) => {
        data = JSON.parse(json)
        // A song can bring its own cast (names, colours, sides).
        Object.assign(VOICES, data.cast ?? {})
        Object.assign(SECTION_NAMES, data.sectionNames ?? {})
        return data.frames.length
      }

      function sectionAt(t) {
        return data.sections.find((section) => t >= section.start && t < section.end) ?? data.sections.at(-1)
      }
      function sectionNumber(section) {
        const same = data.sections.filter((other) => other.section === section.section)
        return same.length > 1 ? ` ${same.indexOf(section) + 1}` : ''
      }

      /** Server racks behind the display: their lights follow the music, and go out at the end. */
      function racks(t, frame, lightsOut, intensity, warmth = 0) {
        const kick = data.kick[frame] ?? 0
        const energy = data.energy[frame] ?? 0
        const travel = t * 14
        const shift = Math.floor(travel / 170)
        const columns = []
        for (let column = -1; column < 13; column += 1) {
          const key = column + shift
          const depth = 0.55 + 0.45 * hash(key * 0.37 + 9)
          columns.push({ key, depth, x: column * 170 - (travel % 170), top: 120 + 60 * (1 - depth) })
        }
        g.save()
        for (const { x, top, depth } of columns) {
          g.fillStyle = `rgb(${8 + 6 * depth}, ${13 + 8 * depth}, ${16 + 9 * depth})`
          g.fillRect(x + 12, top, 146, H - top - 40)
          g.strokeStyle = 'rgba(70, 110, 105, 0.18)'
          g.strokeRect(x + 12.5, top + 0.5, 145, H - top - 41)
          g.fillStyle = 'rgba(30, 48, 52, 0.55)'
          for (let unit = 0; unit < 30; unit += 1) g.fillRect(x + 24, top + 22 + unit * 30, 122, 22)
        }
        if (data.nave) nave(t, columns, energy, warmth)
        g.globalCompositeOperation = 'lighter'
        for (const { key, x, top, depth } of columns) {
          for (let unit = 0; unit < 30; unit += 1) {
            for (let led = 0; led < 4; led += 1) {
              const seed = key * 997 + unit * 31 + led * 7
              if (hash(seed + 0.5) < lightsOut) continue
              const rate = 0.6 + 3 * hash(seed + 1.1)
              if (Math.sin(t * rate * 6.283 + hash(seed) * 40) < 0.15 - 0.9 * energy) continue
              const colorPick = hash(seed + 2.2)
              const color = colorPick < 0.78 - 0.45 * warmth ? MINT : colorPick < 0.95 + 0.05 * warmth ? AMBER : [255, 90, 80]
              const alpha = Math.min(1, (0.4 + 0.6 * kick * hash(seed + 3.3) + 0.3 * intensity) * depth)
              const lx = x + 30 + led * 9
              const ly = top + 30 + unit * 30
              g.fillStyle = rgba(color, alpha)
              g.fillRect(lx, ly, 5, 5)
              g.fillStyle = rgba(color, alpha * 0.22)
              g.fillRect(lx - 5, ly - 5, 15, 15)
            }
          }
        }
        g.restore()
      }

      /**
       * The ball of the song's « ping » and « pong » : it flies from one side to the other
       * on each bip of the music, under the display, and rests when the bips stop.
       */
      function pingPong(t, visibility) {
        const { times, sides, colors } = data.bips
        let last = -1
        for (let low = 0, high = times.length - 1; low <= high;) {
          const middle = (low + high) >> 1
          if (times[middle] <= t) { last = middle; low = middle + 1 } else high = middle - 1
        }
        const next = last + 1 < times.length ? last + 1 : -1
        const left = 360
        const right = W - 360
        const base = 1000
        const xOf = (side) => (side < 0 ? left : right)
        const colorOf = (side) => colors[side < 0 ? 0 : 1]
        const blend = (a, b, u) => a.map((value, index) => Math.round(value + (b[index] - value) * u))
        let x
        let y = base
        let alpha
        let color
        if (last >= 0 && next >= 0 && times[next] - times[last] <= 1.2) {
          const u = (t - times[last]) / (times[next] - times[last])
          x = xOf(sides[last]) + (xOf(sides[next]) - xOf(sides[last])) * u
          y = base - 90 * 4 * u * (1 - u)
          alpha = 1
          color = blend(colorOf(sides[last]), colorOf(sides[next]), u)
        } else if (last >= 0 && t - times[last] < 0.8) {
          x = xOf(sides[last])
          alpha = 1 - (t - times[last]) / 0.8
          color = colorOf(sides[last])
        } else if (next >= 0 && times[next] - t < 0.5) {
          x = xOf(sides[next])
          alpha = 1 - (times[next] - t) / 0.5
          color = colorOf(sides[next])
        } else return
        alpha *= visibility
        // The two players: a short bar on each side, which lights up when the ball lands.
        for (const side of [-1, 1]) {
          let hit = 0
          for (let index = last; index >= 0 && index > last - 3; index -= 1) {
            if (sides[index] === side) { hit = Math.exp(-(t - times[index]) / 0.12); break }
          }
          g.fillStyle = rgba(colorOf(side), (0.25 + 0.75 * hit) * alpha)
          g.shadowColor = rgba(colorOf(side), 0.9)
          g.shadowBlur = 8 + 24 * hit
          g.fillRect(xOf(side) - 40, base + 14, 80, 4)
        }
        g.shadowBlur = 0
        const glow = g.createRadialGradient(x, y, 0, x, y, 46)
        glow.addColorStop(0, rgba(color, 0.55 * alpha))
        glow.addColorStop(1, rgba(color, 0))
        g.fillStyle = glow
        g.fillRect(x - 46, y - 46, 92, 92)
        g.beginPath()
        g.arc(x, y, 8, 0, 2 * Math.PI)
        g.fillStyle = rgba([240, 248, 255], alpha)
        g.fill()
      }

      /**
       * The nave: a pointed arch over each rack, made of points of light (the stones), which
       * light up one after the other over the whole song, « pierre après pierre ».
       */
      function nave(t, columns, energy, warmth) {
        const progress = t / data.duration
        g.save()
        g.globalCompositeOperation = 'lighter'
        for (const { key, x, top, depth } of columns) {
          const span = 146
          const rise = span * Math.sin(Math.PI / 3)
          const stones = []
          for (let index = 0; index <= 9; index += 1) {
            const angle = (index / 9) * (Math.PI / 3)
            stones.push([x + 12 + span - span * Math.cos(angle), top - span * Math.sin(angle)])
            if (index < 9) stones.push([x + 12 + span * Math.cos(angle), top - span * Math.sin(angle)])
          }
          stones.forEach(([sx, sy], index) => {
            // Each stone has its moment; by the last chorus they are all lit.
            const moment = 0.04 + 0.78 * hash(key * 131 + index * 17.3)
            const lit = clamp((progress - moment) / 0.02)
            if (lit <= 0) return
            const glow = (0.35 + 0.35 * energy + 0.3 * warmth) * depth * lit
            const color = warmth > 0 ? [255, 214 - 30 * warmth, 150 - 40 * warmth] : [255, 222, 160]
            g.fillStyle = rgba(color, Math.min(1, glow))
            g.fillRect(sx - 2, sy - 2, 4, 4)
            g.fillStyle = rgba(color, Math.min(1, glow) * 0.18)
            g.fillRect(sx - 6, sy - 6, 12, 12)
          })
          if (sy0(top, rise) > -20) {
            // Keystone, a little brighter.
            const lit = clamp((progress - (0.1 + 0.75 * hash(key * 7.7))) / 0.02)
            if (lit > 0) {
              g.fillStyle = rgba([255, 236, 190], Math.min(1, (0.6 + 0.4 * energy) * depth * lit))
              g.fillRect(x + 12 + span / 2 - 3, top - rise - 3, 6, 6)
            }
          }
        }
        g.restore()
      }
      const sy0 = (top, rise) => top - rise

      function roundedRect(x, y, w, h, r) {
        g.beginPath()
        g.moveTo(x + r, y)
        g.arcTo(x + w, y, x + w, y + h, r)
        g.arcTo(x + w, y + h, x, y + h, r)
        g.arcTo(x, y + h, x, y, r)
        g.arcTo(x, y, x + w, y, r)
        g.closePath()
      }

      /** The vocoder's band meter, lit by the real spectrum of the frame. */
      function meter(x, y, w, h, frame, glow, color) {
        const bands = data.frames[frame] ?? []
        const peaks = data.peaks[frame] ?? []
        const music = data.music?.[frame] ?? []
        const count = bands.length || 24
        const segments = 14
        const gap = 7
        const columnWidth = (w - gap * (count - 1)) / count
        const rowGap = 4
        const segmentHeight = (h - rowGap * (segments - 1)) / segments
        for (let band = 0; band < count; band += 1) {
          const lit = Math.round((bands[band] ?? 0) * segments)
          const peak = Math.round((peaks[band] ?? 0) * segments) - 1
          const backing = Math.round((music[band] ?? 0) * 0.6 * segments)
          for (let segment = 0; segment < segments; segment += 1) {
            const sx = x + band * (columnWidth + gap)
            const sy = y + h - (segment + 1) * segmentHeight - segment * rowGap
            const on = segment < lit || (segment === peak && segment > 0)
            if (on) {
              g.shadowColor = rgba(color, 0.9)
              g.shadowBlur = 10 + 10 * glow
              g.fillStyle = rgba(segment > 11 ? [235, 255, 245] : color, 1)
            } else if (segment < backing) {
              g.shadowBlur = 0
              g.fillStyle = rgba([70, 160, 135], 0.55)
            } else {
              g.shadowBlur = 0
              g.fillStyle = rgba([47, 92, 80], 0.32)
            }
            g.fillRect(sx, sy, columnWidth, segmentHeight)
          }
        }
        g.shadowBlur = 0
      }

      /** A line typed in as it is sung: VFD characters appear one after another. */
      function lyric(text, x, y, align, color, progress, size, alpha) {
        const shown = text.slice(0, Math.ceil(text.length * Math.min(1, progress * 1.35)))
        g.font = `500 ${size}px 'Barlow Semi Condensed'`
        g.textAlign = align
        g.textBaseline = 'alphabetic'
        g.shadowColor = rgba(color, 0.8)
        g.shadowBlur = 18
        g.fillStyle = rgba(color, alpha)
        g.fillText(shown, x, y)
        g.shadowBlur = 0
      }

      /** One row if it fits, otherwise two rows of similar width (no lone word on the second row). */
      function wrap(text, maxWidth, size) {
        g.font = `500 ${size}px 'Barlow Semi Condensed'`
        if (g.measureText(text).width <= maxWidth) return [text]
        const words = text.split(' ')
        let best = [text]
        let bestWidth = Infinity
        for (let split = 1; split < words.length; split += 1) {
          const rows = [words.slice(0, split).join(' '), words.slice(split).join(' ')]
          const width = Math.max(...rows.map((row) => g.measureText(row).width))
          if (width < bestWidth) {
            best = rows
            bestWidth = width
          }
        }
        return best
      }

      window.renderFrame = (frame) => {
        const t = frame / data.fps
        const section = sectionAt(t)
        const final = section.section === 'final'
        const outro = section.section === 'outro'
        const intensity = final ? 1 : section.section === 'chorus' ? 0.6 : 0.2
        // Optional coda (« Veille ») : after the blackout, a heart still beats, an answer comes, and a dawn.
        const coda = data.sections.find((part) => part.section === 'coda')
        const bar = 240 / (data.bpm ?? 112)
        const codaLines = data.lines.filter((line) => line.section === 'coda')
        // Ending « aube » : the racks stay lit and the day rises over the last two bars.
        const sunrise = data.ending === 'aube'
        let lightsOut = outro && !sunrise ? Math.min(1, (t - section.start) / (section.end - section.start)) * 0.97 : !coda && !sunrise && t > data.duration - 3 ? 1 : 0
        let hope = 0
        if (coda && t >= coda.start) {
          hope = clamp((t - (codaLines.at(-1)?.start ?? coda.start + 4 * bar)) / 7)
          lightsOut = 1 - 0.3 * hope
        }
        if (sunrise) {
          const last = data.sections.find((part) => part.section === 'outro')
          if (last) hope = clamp((t - (last.start + 2 * bar)) / 5)
        }
        const zoom = 1 + 0.035 * (final ? Math.min(1, (t - section.start) / 4) : 0)

        g.setTransform(1, 0, 0, 1, 0, 0)
        g.globalCompositeOperation = 'source-over'
        g.fillStyle = '#030507'
        g.fillRect(0, 0, W, H)
        const dawn = (strength) => {
          const sky = g.createLinearGradient(0, H, 0, H - 700)
          sky.addColorStop(0, `rgba(255, 170, 100, ${0.42 * strength})`)
          sky.addColorStop(0.35, `rgba(255, 120, 110, ${0.14 * strength})`)
          sky.addColorStop(1, 'rgba(255, 140, 110, 0)')
          g.fillStyle = sky
          g.fillRect(0, 0, W, H)
          const sun = g.createRadialGradient(W / 2, H + 260, 100, W / 2, H + 260, 1300)
          sun.addColorStop(0, `rgba(255, 196, 130, ${0.5 * strength})`)
          sun.addColorStop(1, 'rgba(255, 150, 100, 0)')
          g.fillStyle = sun
          g.fillRect(0, 0, W, H)
        }
        // The dawn shows between the racks first, then a little in front of them.
        if (hope > 0) dawn(hope)
        g.setTransform(zoom, 0, 0, zoom, W / 2 * (1 - zoom), H / 2 * (1 - zoom))
        racks(t, frame, lightsOut, intensity, hope)

        // Haze and vignette.
        g.setTransform(1, 0, 0, 1, 0, 0)
        const haze = g.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 1100)
        haze.addColorStop(0, 'rgba(3, 6, 8, 0.05)')
        haze.addColorStop(1, 'rgba(1, 2, 3, 0.85)')
        g.fillStyle = haze
        g.fillRect(0, 0, W, H)
        const kick = data.kick[frame] ?? 0
        const floor = g.createRadialGradient(W / 2, H + 120, 50, W / 2, H + 120, 900)
        floor.addColorStop(0, rgba(MINT, (0.05 + 0.16 * kick * (0.4 + intensity)) * (1 - lightsOut)))
        floor.addColorStop(1, rgba(MINT, 0))
        g.fillStyle = floor
        g.fillRect(0, 0, W, H)
        if (hope > 0) dawn(0.6 * hope)

        // The display goes dark at the very end, or just before the coda.
        const fadeOut = coda ? clamp((t - (coda.start - 1)) / 1.5) : clamp((t - (data.duration - 4)) / 2.5)

        // The glass display.
        const px = 240
        const py = 250
        const pw = 1440
        const ph = 600
        g.globalAlpha = 1 - fadeOut
        roundedRect(px, py, pw, ph, 20)
        g.fillStyle = 'rgba(7, 14, 16, 0.9)'
        g.fill()
        g.strokeStyle = rgba(MINT, 0.16 + 0.3 * kick * intensity)
        g.lineWidth = 2
        g.shadowColor = rgba(MINT, 0.5)
        g.shadowBlur = 30 * kick * intensity
        g.stroke()
        g.shadowBlur = 0
        g.save()
        roundedRect(px, py, pw, ph, 20)
        g.clip()
        const sheen = g.createLinearGradient(px, py, px + 500, py + 600)
        sheen.addColorStop(0, 'rgba(255, 255, 255, 0.06)')
        sheen.addColorStop(0.4, 'rgba(255, 255, 255, 0)')
        g.fillStyle = sheen
        g.fillRect(px, py, pw, ph)
        const singing = data.lines.filter((line) => t >= line.start - 0.1 && t < line.end + 0.4).at(-1)
        meter(px + 60, py + 50, pw - 120, 200, frame, intensity, singing ? (VOICES[singing.voice] ?? VOICES.Robot).color : MINT)
        // Fine horizontal grid of a fluorescent display.
        g.fillStyle = 'rgba(0, 0, 0, 0.22)'
        for (let y = py; y < py + ph; y += 3) g.fillRect(px, y, pw, 1)
        g.restore()

        // Section name, top left of the display.
        g.font = "600 26px 'Barlow Semi Condensed'"
        g.textAlign = 'left'
        g.fillStyle = rgba(MINT, coda && t >= coda.start ? 0 : 0.55)
        g.fillText(`${SECTION_NAMES[section.section] ?? ''}${sectionNumber(section)}`, px + 60, py + 296)

        // Lyrics.
        // A line stays up after it is sung (longer in slow songs), until the next one begins.
        const hold = data.hold ?? 0.9
        const current = data.lines.filter((line, index) => t >= line.start - 0.05 && t < Math.min(line.end + hold, data.lines[index + 1]?.start ?? Infinity))
        if (section.section === 'break' && data.log) {
          // A real exchange from the agents' mailbox, typed like a terminal (the last three entries).
          const shown = data.log.filter((entry) => t >= entry.at - 0.05)
          shown.slice(-3).forEach((entry, index, list) => {
            const left = entry.side < 0
            const x = left ? px + 90 : px + pw - 90
            const y = py + 360 + index * 72
            const alpha = index === list.length - 1 ? 1 : 0.5
            g.font = "600 24px 'Barlow Semi Condensed'"
            g.textAlign = left ? 'left' : 'right'
            g.fillStyle = rgba(entry.color, 0.6 * alpha)
            g.fillText(entry.header, x, y)
            lyric(entry.text, x, y + 40, left ? 'left' : 'right', entry.color, (t - entry.at) / 1.2, 40, alpha)
          })
        } else if (section.section === 'bridge') {
          // The dialogue stays on screen, one side for each voice.
          const said = data.lines.filter((line) => line.section === 'bridge' && t >= line.start - 0.05)
          said.slice(-4).forEach((line, index, shown) => {
            const voice = VOICES[line.voice] ?? VOICES.Robot
            const left = voice.side !== 'right'
            const y = py + 380 + index * 64
            const age = shown.length - 1 - index
            lyric(line.text, left ? px + 90 : px + pw - 90, y, left ? 'left' : 'right', voice.color, (t - line.start) / Math.max(0.3, line.end - line.start), 52, age === 0 ? 1 : 0.45)
          })
        } else if (current.length > 0) {
          const line = current.at(-1)
          const voice = VOICES[line.voice] ?? VOICES.Robot
          const progress = (t - line.start) / Math.max(0.3, line.end - line.start)
          g.font = "600 30px 'Barlow Semi Condensed'"
          g.textAlign = 'center'
          g.fillStyle = rgba(voice.color, 0.75)
          // Another language is named only when it carries most of the line.
          const share = (lang) => line.parts.filter(([language]) => language === lang).reduce((sum, [, words]) => sum + words.length, 0) / line.text.length
          const foreign = share(data.mainLanguage) >= 0.5 ? [] : [...new Set(line.langs)].filter((lang) => lang !== data.mainLanguage)
          // The same words said together by several voices: « Tom et Jessica ».
          const together = current.filter((other) => other.start === line.start && other.text === line.text)
          const label = together.length > 1 ? together.map((other) => (VOICES[other.voice] ?? VOICES.Robot).label.split(',')[0]).join(' et ') : voice.label
          g.fillText(foreign.length ? `${label}, ${foreign.map((lang) => LANGUAGES[lang] ?? lang).join(', ')}` : label, W / 2, py + 380)
          const rows = wrap(line.text, pw - 200, 72)
          rows.forEach((row, index) => {
            const before = rows.slice(0, index).join(' ').length
            const rowProgress = (progress * line.text.length * 1.35 - before) / Math.max(1, row.length) / 1.35
            lyric(row, W / 2, py + 470 + index * 86, 'center', voice.color, Math.max(0, rowProgress), 72, 1)
          })
        }
        g.globalAlpha = 1

        if (data.bips) pingPong(t, 1 - fadeOut)

        // Title, over the opening.
        const titleAlpha = Math.max(0, Math.min(1, t / 1.2, (8.4 - t) / 1.5))
        if (titleAlpha > 0) {
          g.textAlign = 'center'
          g.font = "400 84px 'Michroma'"
          g.shadowColor = rgba(MINT, 0.6)
          g.shadowBlur = 24
          g.fillStyle = `rgba(230, 255, 246, ${titleAlpha})`
          g.fillText(data.title, W / 2, 175)
          g.shadowBlur = 0
          g.font = "500 32px 'Barlow Semi Condensed'"
          g.fillStyle = rgba(MINT, 0.7 * titleAlpha)
          g.fillText(data.subtitle, W / 2, 222)
        }

        if (coda && t >= coda.start - 1.5) {
          // One light never went out: the machine's heart, beating. The human's light joins it,
          // and once the answer has come they beat together.
          const kickNow = data.kick[frame] ?? 0
          const question = codaLines[0]
          const answer = codaLines.at(-1)
          const human = question ? clamp((t - (question.start - 0.6)) / 0.8) : 0
          const together = answer ? clamp(t - answer.start) : 0
          const ease = human * human * (3 - 2 * human)
          const hy = H / 2 - 110
          const heart = (x, color, alpha, pulse) => {
            const radius = 40 + 90 * pulse
            const glow = g.createRadialGradient(x, hy, 0, x, hy, radius)
            glow.addColorStop(0, rgba(color, (0.3 + 0.5 * pulse) * alpha))
            glow.addColorStop(1, rgba(color, 0))
            g.fillStyle = glow
            g.fillRect(x - radius, hy - radius, 2 * radius, 2 * radius)
            g.beginPath()
            g.arc(x, hy, 6 + 4 * pulse, 0, 2 * Math.PI)
            g.fillStyle = rgba(color, alpha)
            g.shadowColor = rgba(color, 0.9)
            g.shadowBlur = 16
            g.fill()
            g.shadowBlur = 0
          }
          if (human > 0) heart(W / 2 - 70 * ease, AMBER, human, 0.25 + 0.75 * kickNow * together)
          heart(W / 2 + 70 * ease, MINT, clamp((t - (coda.start - 1.5)) / 1.5), kickNow)
          // Their two lines, typed in the dark, then the title over the dawn.
          const cardAt = coda.start + 6 * bar
          g.globalAlpha = 1 - clamp((t - (cardAt - 0.6)) / 1)
          codaLines.forEach((line, index) => {
            if (t < line.start - 0.05) return
            const voice = VOICES[line.voice] ?? VOICES.Robot
            lyric(line.text, W / 2, H / 2 + 20 + index * 80, 'center', voice.color, (t - line.start) / Math.max(0.3, line.end - line.start), 56, 1)
          })
          g.globalAlpha = 1
          const cardAlpha = clamp((t - cardAt) / 1.5)
          if (cardAlpha > 0) {
            g.textAlign = 'center'
            g.font = "400 56px 'Michroma'"
            g.shadowColor = rgba(MINT, 0.7)
            g.shadowBlur = 20
            g.fillStyle = `rgba(235, 255, 246, ${cardAlpha})`
            g.fillText(data.title, W / 2, H / 2 + 50)
            g.shadowBlur = 0
            g.font = "500 30px 'Barlow Semi Condensed'"
            g.fillStyle = rgba([235, 225, 210], 0.75 * cardAlpha)
            g.fillText(data.credits, W / 2, H / 2 + 106)
          }
          const black = clamp((t - (data.duration - 1.6)) / 1.4)
          if (black > 0) {
            g.fillStyle = `rgba(0, 0, 0, ${black})`
            g.fillRect(0, 0, W, H)
          }
        }

        // End card, once the display is dark (songs without a coda).
        if (!coda && fadeOut > 0) {
          const endAlpha = Math.min(1, fadeOut * 1.5) * Math.max(0, Math.min(1, (data.duration - t) / 0.8))
          g.textAlign = 'center'
          g.font = "400 56px 'Michroma'"
          g.shadowColor = rgba(MINT, 0.7)
          g.shadowBlur = 20
          g.fillStyle = `rgba(230, 255, 246, ${endAlpha})`
          g.fillText(data.title, W / 2, H / 2 - 10)
          g.shadowBlur = 0
          g.font = "500 30px 'Barlow Semi Condensed'"
          g.fillStyle = rgba(MINT, 0.7 * endAlpha)
          g.fillText(data.credits, W / 2, H / 2 + 46)
        }
        return canvas.toDataURL('image/jpeg', 0.92)
      }

      window.clipReady = document.fonts.ready.then(() => Promise.all([
        document.fonts.load("400 84px 'Michroma'"),
        document.fonts.load("500 72px 'Barlow Semi Condensed'"),
        document.fonts.load("600 30px 'Barlow Semi Condensed'"),
      ])).then(() => true)
    </script>
  </body>
</html>
