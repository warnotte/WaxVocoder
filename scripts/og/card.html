<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Carte de partage Wax Vocoder</title>
    <link rel="stylesheet" href="./card.css" />
  </head>
  <body>
    <!-- Image de partage (Open Graph), 1200 × 630 : capturée vers public/og-image.png, voir README. -->
    <h1>Wax Vocoder</h1>
    <p class="tagline">Synthétiseur de voix et vocoder, dans le navigateur</p>
    <div class="glass">
      <div class="bars" id="bars"></div>
      <div class="phrase">Bonjour, je suis une machine qui parle et qui chante.</div>
    </div>
    <script>
      const levels = [5, 7, 8, 9, 8, 10, 11, 12, 10, 9, 11, 12, 11, 9, 7, 8, 9, 7, 6, 7, 6, 5, 4, 3]
      const bars = document.getElementById('bars')
      for (const level of levels) {
        const bar = document.createElement('div')
        bar.className = 'bar'
        for (let segment = 11; segment >= 0; segment -= 1) {
          const cell = document.createElement('div')
          cell.className = segment < level ? 'segment on' : 'segment'
          bar.append(cell)
        }
        bars.append(bar)
      }
    </script>
  </body>
</html>
